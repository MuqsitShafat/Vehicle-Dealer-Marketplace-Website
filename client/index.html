<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1"
    />
    <title>
      Waseem — Cars, Bikes, Tractors & Spare Parts | Buy, Sell & Trade
    </title>
    <meta
      name="description"
      content="Waseem — your trusted dealership for cars, bikes, tractors and genuine spare parts. Buy, sell or get your vehicle listed today."
    />
    <link rel="icon" type="image/png" href="/src/assets/images/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden form definitions for Netlify Bot Detection & Forms Integration -->
    <div style="display: none;">
      <form name="contact_home" data-netlify="true">
        <input type="email" name="email" />
        <textarea name="message"></textarea>
        <button type="submit">Submit</button>
      </form>
      <form name="contact_page" data-netlify="true">
        <input type="text" name="name" />
        <input type="email" name="email" />
        <input type="text" name="phone" />
        <input type="text" name="subject" />
        <textarea name="message"></textarea>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
